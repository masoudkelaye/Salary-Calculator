      try {
        const res = await fetch(ratesUrl + (ratesUrl.includes('?') ? '&' : '?') + 't=' + Date.now(), {
          cache: 'no-store', credentials: 'omit'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const remote = await res.json();
        if (!remote || !remote.version) throw new Error('Invalid rates file');
        let storedVer = null;
        try { storedVer = localStorage.getItem('taxRatesVersion'); } catch (e) {}
        window.TAX_RATES = remote;
        try {
          localStorage.setItem('taxRatesCache', JSON.stringify(remote));
          localStorage.setItem('taxRatesVersion', remote.version);
          localStorage.setItem('taxRatesCheckedAt', new Date().toISOString());
        } catch (e) {}
        const changed = storedVer && storedVer !== remote.version;
        const msg = t(
          'بررسی به‌روزرسانی انجام شد.\n\nآدرس: ' + ratesUrl + '\nنسخه: ' + remote.version + '\nتاریخ: ' + (remote.updated || '—') + '\nقبلی: ' + (storedVer || 'نداشتید') + '\n\n' +
          (changed ? '✓ نسخه جدید اعمال شد. محاسبات از این نرخ‌ها استفاده می‌کنند.' : 'نسخه هم‌خوان است یا اولین بار ذخیره شد.'),
          'Update check done.\n\nURL: ' + ratesUrl + '\nVersion: ' + remote.version + '\nUpdated: ' + (remote.updated || '—') + '\nPrevious: ' + (storedVer || 'none') + '\n\n' +
          (changed ? '✓ New rates applied — calculations use them now.' : 'Up to date (or first save).')
        );
        if (!silent) alert(msg);
        else if (changed) {
          const note = document.getElementById('countryNote');
          if (note) note.textContent = currentLang === 'fa'
            ? ('✓ قوانین مالیاتی به‌روز شد (نسخه ' + remote.version + ')')
            : ('✓ Tax rates updated (version ' + remote.version + ')');
        }
        return { ok: true, version: remote.version, changed: !!changed };
      } catch (err) {
        if (!silent) {
          alert(t('خطا در بررسی به‌روزرسانی:\n' + err.message + '\n\nآدرس: ' + ratesUrl,
            'Update check failed:\n' + err.message + '\n\nURL: ' + ratesUrl));
        }
        return { ok: false, error: String(err.message || err) };
      } finally {
        if (btn && !silent) btn.textContent = prev;
      }
    };

    window.scheduleRatesAutoCheck = function() {
      let months = 3;
      try {
        const m = parseInt(localStorage.getItem('ratesCheckMonths') || '3', 10);
        if (m === 6 || m === 3) months = m;
      } catch (e) {}
      const intervalMs = months * 30 * 24 * 60 * 60 * 1000;
      let last = null;
      try { last = localStorage.getItem('taxRatesCheckedAt'); } catch (e) {}
      const due = !last || (Date.now() - new Date(last).getTime() >= intervalMs);
      if (due) showUpdateInfo(true).catch(function(){});
    };

    (function loadCachedRates() {
      try {
        const raw = localStorage.getItem('taxRatesCache');
        if (raw) {
          const o = JSON.parse(raw);
          if (o && o.version) window.TAX_RATES = o;
        }
      } catch (e) {}
      fetch('./rates.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(o => {
          if (o && o.version) {
            window.TAX_RATES = o;
            try {
              localStorage.setItem('taxRatesCache', JSON.stringify(o));
              localStorage.setItem('taxRatesVersion', o.version);
            } catch (e) {}
          }
        })
        .catch(() => {});
    })();

    (function initLangDd() {
      const dd = document.getElementById('langDd');
      const btn = document.getElementById('langDdBtn');
      const menu = document.getElementById('langDdMenu');
      if (!dd || !btn || !menu) return;
      function closeMenu() {
        dd.classList.remove('open');
        menu.style.display = 'none';
        btn.setAttribute('aria-expanded', 'false');
      }
      function openMenu() {
        dd.classList.add('open');
        menu.style.display = 'block';
        menu.style.zIndex = '10001';
        btn.setAttribute('aria-expanded', 'true');
        const topbar = document.querySelector('.topbar');
        if (topbar) topbar.style.zIndex = '10000';
      }
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (dd.classList.contains('open')) closeMenu();
        else openMenu();
      });
      menu.querySelectorAll('.lang-dd-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const lang = item.dataset.lang;
          if (lang) setLang(lang);
          closeMenu();
        });
        item.addEventListener('mouseenter', () => {
          item.style.background = '#334155';
          item.style.color = '#38bdf8';
        });
        item.addEventListener('mouseleave', () => {
          item.style.background = '#1e293b';
          item.style.color = '#f8fafc';
        });
      });
      document.addEventListener('click', closeMenu);
    })();



    toggleInput();
    let savedLang = 'fa';
    try { savedLang = localStorage.getItem('netSalaryLang') || 'fa'; } catch (e) {}
    setLang(savedLang);
    onCountryChange();
    try { scheduleRatesAutoCheck(); } catch (e) {}
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }


  </script>
</body>
</html>
